<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>挂播打投打卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F5; --surface:#FFFFFF; --surface-2:#F5F6FA; --ink:#1C2030; --ink-2:#5B6175; --line:#DCDFE8;
  --qq:#1FAE68; --qq-soft:#E1F6EA; --kg:#1E86E0; --kg-soft:#E2EFFC; --kw:#D98A00; --kw-soft:#FFF1D2;
  --warn:#B4500B; --warn-soft:#FFE7D3; --focus:#6C4CE0; --on:#fff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13151C; --surface:#1D2029; --surface-2:#252935; --ink:#ECEEF4; --ink-2:#A3A8B8; --line:#333847;
    --qq:#3DD08A; --qq-soft:#173A29; --kg:#5AAEF5; --kg-soft:#172F47; --kw:#FFC23D; --kw-soft:#3B2E10;
    --warn:#FF9F5A; --warn-soft:#3D2513; --focus:#A58CFF; --on:#121318; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13151C; --surface:#1D2029; --surface-2:#252935; --ink:#ECEEF4; --ink-2:#A3A8B8; --line:#333847;
  --qq:#3DD08A; --qq-soft:#173A29; --kg:#5AAEF5; --kg-soft:#172F47; --kw:#FFC23D; --kw-soft:#3B2E10;
  --warn:#FF9F5A; --warn-soft:#3D2513; --focus:#A58CFF; --on:#121318; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-anchor:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input{font-size:16px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-family:"Outfit","Noto Sans SC",system-ui,sans-serif;font-variant-numeric:tabular-nums}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.brand{font-weight:900;font-size:18px;letter-spacing:.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.dots{display:inline-flex;gap:3px}.dots i{width:9px;height:9px;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--qq)}.dots i:nth-child(2){background:var(--kg)}.dots i:nth-child(3){background:var(--kw)}
nav{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
nav button{border:0;background:none;padding:6px 14px;border-radius:9px;font-weight:500;color:var(--ink-2)}
nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(20,24,40,.12)}
nav svg{display:none}
.sync{margin-left:auto;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync b{width:8px;height:8px;border-radius:50%;background:var(--ink-2);display:block;flex:none}
.sync.cloud b{background:var(--qq)}.sync.local b{background:var(--kw)}

main{max-width:1180px;margin:0 auto;padding:20px 18px 60px}

/* Day header */
.dayhead{display:grid;grid-template-columns:auto 1fr;gap:16px 28px;align-items:end;margin-bottom:12px}
.datepick{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.datepick button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 12px;font-size:14px;min-height:38px}
.datepick button:disabled{opacity:.35}
.datepick input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 9px;min-height:38px}
.score{display:flex;align-items:baseline;gap:10px;margin-top:12px}
.score .big{font-size:56px;font-weight:800;line-height:1}
.score .of{font-size:22px;color:var(--ink-2);font-weight:500}
.cap{color:var(--ink-2);font-size:14px;margin-top:2px}
.plats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.plat{background:var(--surface);border-radius:14px;padding:10px 12px;border:1px solid var(--line)}
.plat .t{display:flex;justify-content:space-between;gap:6px;font-size:13.5px;font-weight:700}
.plat .t span:last-child{font-weight:500;color:var(--ink-2)}
.meter{height:6px;border-radius:6px;background:var(--surface-2);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;transition:width .25s}

details.bulkbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
details.bulkbox summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px;list-style:none;display:flex;align-items:center;gap:8px;-webkit-tap-highlight-color:transparent}
details.bulkbox summary::-webkit-details-marker{display:none}
details.bulkbox summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(45deg);transition:transform .15s}
details.bulkbox[open] summary::after{transform:rotate(-135deg)}
.bulk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px 12px}
.bulk .col{display:flex;flex-direction:column;gap:6px}
.bulk button{border:0;border-radius:10px;padding:9px 8px;font-size:13.5px;font-weight:600;min-height:42px;display:flex;justify-content:space-between;gap:6px;align-items:center}

.tools{display:flex;gap:10px;align-items:center;margin:4px 0 14px;flex-wrap:wrap;color:var(--ink-2);font-size:14px}
.tools label{display:flex;align-items:center;gap:8px;cursor:pointer;min-height:36px}
.tools input[type=checkbox]{width:18px;height:18px;accent-color:var(--focus)}

/* Account cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px}
.card.done{border-color:color-mix(in srgb,var(--qq) 55%,var(--line))}
.card h3{margin:0 0 6px;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .nm{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:3px 6px;margin-left:-6px;font-size:16px;font-weight:700}
.card h3 .nm:hover,.card h3 .nm:focus{border-color:var(--line);background:var(--surface-2)}
.card h3 .cnt{flex:none;font-size:13px;font-weight:600;color:var(--ink-2)}
.card.done h3 .cnt{color:var(--qq)}
.row{display:grid;grid-template-columns:60px 1fr 1fr;gap:8px;align-items:center;padding:4px 0}
.row .pn{font-size:13px;font-weight:700}
.tg{border:1.5px solid var(--line);background:var(--surface-2);border-radius:11px;padding:6px 4px;font-size:14.5px;font-weight:500;color:var(--ink-2);transition:background .12s,border-color .12s,color .12s;display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px}
.tg::before{content:"";width:15px;height:15px;border-radius:50%;border:1.5px solid currentColor;flex:none;box-sizing:border-box}
.tg[aria-pressed="true"]{color:var(--on);font-weight:700}
.tg[aria-pressed="true"]::before{border-color:var(--on);background:var(--on);box-shadow:inset 0 0 0 3.5px var(--c)}
.qq .tg[aria-pressed="true"]{background:var(--qq);border-color:var(--qq);--c:var(--qq)}
.kg .tg[aria-pressed="true"]{background:var(--kg);border-color:var(--kg);--c:var(--kg)}
.kw .tg[aria-pressed="true"]{background:var(--kw);border-color:var(--kw);--c:var(--kw)}
.qq .pn{color:var(--qq)}.kg .pn{color:var(--kg)}.kw .pn{color:var(--kw)}
.kwn{display:grid;grid-template-columns:60px 1fr;gap:8px;align-items:center;padding:8px 0 2px;border-top:1px dashed var(--line);margin-top:4px}
.kwn label{font-size:12.5px;color:var(--ink-2);line-height:1.3}
.kwn .in{display:flex;align-items:center;gap:8px}
.kwn input{width:100%;max-width:150px;border:1.5px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 10px;min-height:42px}
.delta{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.delta.up{color:var(--qq)}.delta.zero{color:var(--warn);font-weight:600}

/* Self-check table */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:14px}
th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1;max-width:110px;overflow:hidden;text-overflow:ellipsis}
thead th{font-weight:600;color:var(--ink-2);font-size:13px}
td .d{display:block;font-size:12px;color:var(--ink-2)}
td.z{background:var(--warn-soft)} td.z .d{color:var(--warn);font-weight:600}
td.m{color:var(--ink-2)}
.note{color:var(--ink-2);font-size:14px;max-width:64ch;margin:0 0 14px}

/* Setup & manage */
.setup{max-width:460px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px}
.setup h1{margin:0 0 6px;font-size:26px;font-weight:900}
.setup p{margin:0 0 18px;color:var(--ink-2)}
.stepper{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.stepper button.sq{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:22px}
.stepper input{width:90px;text-align:center;font-size:28px;font-weight:700;border:1.5px solid var(--line);border-radius:12px;padding:4px;background:var(--surface-2)}
.primary{border:0;background:var(--ink);color:var(--surface);border-radius:12px;padding:11px 18px;font-weight:700;font-size:15px;min-height:44px}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:14px;min-height:44px}
.danger{color:var(--warn)}
.countbox{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;max-width:560px;margin-bottom:16px}
.countbox .stepper{margin:10px 0 0}
.countbox .stepper input{width:80px;font-size:22px}
.hint{margin:10px 0 0;font-size:14px;color:var(--ink-2)}
.hint.warn{color:var(--warn);font-weight:500}
.mlist{display:flex;flex-direction:column;gap:8px;max-width:560px}
.mitem{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 8px;min-height:52px}
.mitem.picked{border-color:var(--warn);background:var(--warn-soft)}
.mitem .pick{display:flex;align-items:center;justify-content:center;width:36px;height:40px;flex:none;cursor:pointer}
.mitem .pick input{width:19px;height:19px;accent-color:var(--warn);margin:0}
.mitem .idx{width:24px;color:var(--ink-2);font-size:13px;flex:none}
.mitem .rn{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:8px;padding:7px 8px}
.mitem .rn:hover,.mitem .rn:focus{border-color:var(--line);background:var(--surface-2)}
.mitem .del{border:0;background:none;color:var(--ink-2);padding:8px 10px;border-radius:8px;min-height:40px;flex:none}
.mitem .del:hover{color:var(--warn);background:var(--warn-soft)}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
h2{font-size:20px;margin:0 0 6px}
.empty{color:var(--ink-2);padding:30px 0;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;white-space:nowrap}
.toast.show{opacity:1}

/* ---------- phone ---------- */
@media (max-width:720px){
  body{font-size:15px}
  .bar{padding:10px 14px;gap:10px}
  .brand{font-size:16px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:8;border-radius:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:0}
  nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:12px;min-height:52px}
  nav button[aria-current="page"]{background:none;box-shadow:none;color:var(--focus);font-weight:700}
  nav svg{display:block;width:22px;height:22px}
  main{padding:14px 12px calc(96px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .dayhead{grid-template-columns:1fr;gap:12px}
  .datepick input{flex:1;min-width:0}
  .score{margin-top:10px}
  .score .big{font-size:40px}
  .score .of{font-size:18px}
  .plats{gap:6px}
  .plat{padding:8px 9px;border-radius:12px}
  .plat .t{flex-direction:column;gap:0;font-size:13px}
  .bulk{grid-template-columns:1fr;gap:6px}
  .bulk .col{flex-direction:row}
  .bulk .col button{flex:1}
  .grid{grid-template-columns:1fr;gap:10px}
  .card{padding:12px 10px 8px;border-radius:14px}
  .row{grid-template-columns:52px 1fr 1fr;gap:6px}
  .tg{min-height:46px;font-size:15px}
  .kwn{grid-template-columns:52px 1fr}
  .kwn input{max-width:none}
  .setup{margin:4vh auto 0;padding:22px}
  .countbox,.mlist{max-width:none}
}
@media (max-width:360px){.sync span{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><span class="dots"><i></i><i></i><i></i></span>挂播打投打卡</div>
  <nav id="nav" aria-label="页面">
    <button data-tab="today" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8.5 12.5l2.5 2.5 4.5-5"/></svg>每日打卡</button>
    <button data-tab="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M7 15V10M12 15V6M17 15v-3"/></svg>酷我自查</button>
    <button data-tab="manage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-3.5 3.8-5 7-5s6 1.5 7 5"/></svg>账号管理</button>
  </nav>
  <div class="sync" id="sync"><b></b><span>正在连接…</span></div>
</div></header>
<main id="main"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const PLATS=[{k:"qq",n:"QQ音乐"},{k:"kg",n:"酷狗"},{k:"kw",n:"酷我"}];
const TASKS=[{k:"g",n:"挂播"},{k:"t",n:"打投"}];
const LS="gbdt-tracker-v1";
const KEEP_DAYS=75;
const START="2026-10-18";   // records start on this day; anything earlier is removed

let state={v:1,ts:0,accounts:[],days:{}};
let tab="today", day=todayKey(), onlyTodo=false, bulkOpen=false;
let keepShown=new Set();           // cards completed while "只看未完成" is on stay visible until the view changes
let sel=new Set(), target=null;
let mode="loading", ref=null, saveTimer=null, inflight=false, deferred=false;
const lastTap={};

function todayKey(d=new Date()){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function shift(key,n){const [y,m,d]=key.split("-").map(Number);return todayKey(new Date(y,m-1,d+n))}
function label(key){const [y,m,d]=key.split("-").map(Number);const w="日一二三四五六"[new Date(y,m-1,d).getDay()];return m+"月"+d+"日 周"+w}
function uid(){return "a"+Math.random().toString(36).slice(2,9)}
function rec(dk,aid){state.days[dk]??={};return state.days[dk][aid]??={}}
function peek(dk,aid){return (state.days[dk]||{})[aid]||{}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function clone(o){return JSON.parse(JSON.stringify(o))}
function valid(s){return s&&Array.isArray(s.accounts)&&s.days&&typeof s.days==="object"}

/* ---------- storage ---------- */
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(valid(s))return s}catch(e){}return null}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function prune(){let cut=shift(todayKey(),-KEEP_DAYS);if(cut<START)cut=START;for(const k of Object.keys(state.days))if(k<cut)delete state.days[k]}
function save(){
  state.ts=Math.max(Date.now(),(state.ts||0)+1);
  prune();saveLocal();
  if(mode!=="cloud"||!ref)return;
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,400);
}
async function flush(){
  if(inflight){clearTimeout(saveTimer);saveTimer=setTimeout(flush,300);return}
  inflight=true;
  try{await ref.set(clone(state))}
  catch(e){
    if(e&&e.code==="invalid_argument"){setMode("local");toast("无法保存到云端，已改为保存在本浏览器")}
    else if(e&&(e.code==="unavailable"||e.code==="resource_exhausted")){setTimeout(flush,1500+Math.random()*1000)}
  }finally{inflight=false}
}
function setMode(m){
  mode=m;const el=document.getElementById("sync");
  el.className="sync "+(m==="cloud"?"cloud":m==="local"?"local":"");
  el.querySelector("span").textContent=m==="cloud"?"已云端同步":m==="local"?"仅存本浏览器":"正在连接…";
  el.title=m==="cloud"?"数据保存在你的 Claude 账号下，换设备也能看到":m==="local"?"数据只保存在这台设备的浏览器里":"";
}
function applyRemote(d){
  // only accept data that is newer than what this page already has; stale echoes of our own writes are ignored
  if(!valid(d)||(d.ts||0)<=(state.ts||0))return;
  state=clone(d);saveLocal();
  if(busy())deferred=true;else softRender();
}
function busy(){const a=document.activeElement;return a&&a.tagName==="INPUT"&&a.type!=="checkbox"}
async function connect(){
  try{
    if(!window.claude||!window.claude.use){setMode("local");return}
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user){setMode("local");return}
    const id=await user.id();
    if(!id){setMode("local");return}
    ref=db.doc("data/users/"+id+"/state");
    const snap=await ref.get();
    setMode("cloud");
    const remote=snap.exists?snap.data():null;
    if(valid(remote)&&(remote.ts||0)>(state.ts||0)){state=clone(remote);saveLocal();softRender()}
    else if(state.accounts.length){flush()}
    ref.onSnapshot(s=>{if(s.exists&&!s.metadata.hasPendingWrites)applyRemote(s.data())},()=>{});
  }catch(e){setMode("local")}
}
document.addEventListener("focusout",()=>{setTimeout(()=>{if(deferred&&!busy()){deferred=false;softRender()}},50)});

/* ---------- helpers ---------- */
function doneCount(dk,aid){const r=peek(dk,aid);let c=0;for(const p of PLATS)for(const t of TASKS)if(r[p.k+"_"+t.k])c++;return c}
function platCount(dk,pk,tk){let c=0;for(const a of state.accounts)if(peek(dk,a.id)[pk+"_"+tk])c++;return c}
function prevCount(dk,aid){for(let i=1;i<=KEEP_DAYS;i++){const v=peek(shift(dk,-i),aid).kw_n;if(typeof v==="number")return v}return null}
function deltaHtml(dk,aid){
  const v=peek(dk,aid).kw_n;if(typeof v!=="number")return "";
  const p=prevCount(dk,aid);if(p===null)return '<span class="delta">首次记录</span>';
  const d=v-p;
  return '<span class="delta '+(d>0?"up":"zero")+'">'+(d>0?"+"+d:d===0?"没涨":d)+'</span>';
}
let tt;function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2000)}

/* ---------- views ---------- */
function render(){
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===tab?"page":"false"));
  const m=document.getElementById("main");
  if(!state.accounts.length&&tab!=="manage"){m.innerHTML=setupView();return}
  m.innerHTML=tab==="today"?todayView():tab==="check"?checkView():manageView();
}
function softRender(){
  // redraw without losing scroll position or the field being typed in
  const y=window.scrollY,a=document.activeElement,fid=a&&a.id;
  render();
  window.scrollTo(0,y);
  if(fid){const el=document.getElementById(fid);if(el)el.focus({preventScroll:true})}
}
function setupView(){
  return `<section class="setup">
    <h1>你每天要挂几个号？</h1>
    <p>先填数量，系统会生成“账号1、账号2……”，之后可以随时改名、加号或删号。</p>
    <div class="stepper"><button class="sq" data-act="dec" aria-label="减少">−</button>
      <input id="cnt" class="num" type="number" min="1" max="200" value="5" inputmode="numeric" aria-label="账号数量">
      <button class="sq" data-act="inc" aria-label="增加">+</button></div>
    <button class="primary" data-act="create">生成打卡表</button>
  </section>`;
}
function dateBar(){
  return `<div class="datepick">
    <button data-act="prev" aria-label="前一天" ${day<=START?"disabled":""}>‹ 前一天</button>
    <input type="date" id="date" value="${day}" min="${START}" max="${todayKey()}" aria-label="选择日期">
    <button data-act="next" aria-label="后一天" ${day>=todayKey()?"disabled":""}>后一天 ›</button>
    ${day!==todayKey()?'<button data-act="today">回到今天</button>':""}
  </div>`;
}
function bulkLabel(pk,tk){const N=state.accounts.length,c=platCount(day,pk,tk),t=TASKS.find(x=>x.k===tk).n;
  return `<span>${c===N?"撤销全部"+t:"全部"+t+"完成"}</span><span class="num">${c}/${N}</span>`}
function todayView(){
  const N=state.accounts.length;
  const plats=PLATS.map(p=>`<div class="plat ${p.k}"><div class="t"><span class="pn">${p.n}</span><span class="num" data-stat="p-${p.k}"></span></div>
      <div class="meter"><i data-meter="${p.k}" style="background:var(--${p.k})"></i></div></div>`).join("");
  const bulk=PLATS.map(p=>`<div class="col">${TASKS.map(tk=>`<button data-act="bulk" data-p="${p.k}" data-t="${tk.k}" style="background:var(--${p.k}-soft);color:var(--${p.k})">${bulkLabel(p.k,tk.k)}</button>`).join("")}</div>`).join("");
  const list=state.accounts.filter(a=>!onlyTodo||doneCount(day,a.id)<6||keepShown.has(a.id));
  const cards=list.map(a=>{
    const r=peek(day,a.id),c=doneCount(day,a.id);
    return `<article class="card ${c===6?"done":""}" data-a="${a.id}">
      <h3><input class="nm" id="nm-${a.id}" data-act="rename" value="${esc(a.name)}" aria-label="账号名称，可直接修改" enterkeyhint="done"><span class="cnt num">${c===6?"今日完成":c+"/6"}</span></h3>
      ${PLATS.map(p=>`<div class="row ${p.k}"><span class="pn">${p.n}</span>
        ${TASKS.map(t=>`<button type="button" class="tg" data-act="tg" data-k="${p.k}_${t.k}" aria-pressed="${!!r[p.k+"_"+t.k]}">${t.n}</button>`).join("")}</div>`).join("")}
      <div class="kwn"><label for="n-${a.id}">酷我昨日累计听歌</label>
        <div class="in"><input class="num" id="n-${a.id}" data-act="kwn" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off" placeholder="填数字" value="${typeof r.kw_n==="number"?r.kw_n:""}">
        <span id="d-${a.id}">${deltaHtml(day,a.id)}</span></div></div>
    </article>`;
  }).join("");
  const html=`<div class="dayhead">
      <div>${dateBar()}
        <div class="score"><span class="big num" data-stat="done"></span><span class="of num">/ ${N*6}</span></div>
        <div class="cap">${label(day)}，${N} 个账号，每号 6 项</div></div>
      <div class="plats">${plats}</div>
    </div>
    <details class="bulkbox" id="bulkbox" ${bulkOpen?"open":""}><summary>批量操作</summary><div class="bulk">${bulk}</div></details>
    <div class="tools"><label><input type="checkbox" id="todo" ${onlyTodo?"checked":""}>只看还没做完的账号</label></div>
    <div class="grid">${cards||'<p class="empty">这一天的账号全部做完了。</p>'}</div>`;
  queueMicrotask(updateStats);
  return html;
}
function updateStats(){
  if(tab!=="today")return;
  const N=state.accounts.length;let done=0;for(const a of state.accounts)done+=doneCount(day,a.id);
  const d=document.querySelector('[data-stat="done"]');if(d)d.textContent=done;
  for(const p of PLATS){
    const c=platCount(day,p.k,"g")+platCount(day,p.k,"t");
    const s=document.querySelector('[data-stat="p-'+p.k+'"]');if(s)s.textContent=c+"/"+N*2;
    const m=document.querySelector('[data-meter="'+p.k+'"]');if(m)m.style.width=(N?c/(N*2)*100:0)+"%";
    for(const tk of TASKS){const b=document.querySelector('[data-act="bulk"][data-p="'+p.k+'"][data-t="'+tk.k+'"]');if(b)b.innerHTML=bulkLabel(p.k,tk.k)}
  }
}
function updateCard(aid){
  const card=document.querySelector('.card[data-a="'+aid+'"]');if(!card)return;
  const r=peek(day,aid),c=doneCount(day,aid);
  card.querySelectorAll(".tg").forEach(b=>b.setAttribute("aria-pressed",!!r[b.dataset.k]));
  card.querySelector(".cnt").textContent=c===6?"今日完成":c+"/6";
  card.classList.toggle("done",c===6);
}
function checkView(){
  const days=[];for(let i=6;i>=0;i--){const k=shift(day,-i);if(k>=START)days.push(k)}
  const head=days.map(k=>{const [,m,d]=k.split("-").map(Number);return `<th>${m}/${d}</th>`}).join("");
  const rows=state.accounts.map(a=>{
    const cells=days.map(k=>{
      const v=peek(k,a.id).kw_n;
      if(typeof v!=="number")return '<td class="m">—</td>';
      const p=prevCount(k,a.id);const d=p===null?null:v-p;
      return `<td class="num ${d!==null&&d<=0?"z":""}">${v}<span class="d">${d===null?"首次":d>0?"+"+d:d===0?"没涨":d}</span></td>`;
    }).join("");
    return `<tr><td title="${esc(a.name)}">${esc(a.name)}</td>${cells}</tr>`;
  }).join("");
  return `<div class="dayhead" style="grid-template-columns:1fr"><div>${dateBar()}</div></div>
    <h2>酷我累计听歌数</h2>
    <p class="note">每天在打卡页填“昨日累计听歌数”，这里会算出比上一次记录涨了多少。橙色格子表示没涨，说明那个号前一天可能没挂上。手机上可以左右滑动表格。</p>
    <div class="tablewrap"><table><thead><tr><th>账号</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function manageView(){
  const N=state.accounts.length,T=target??N,need=N-T;
  for(const id of [...sel])if(!state.accounts.some(a=>a.id===id))sel.delete(id);
  let hint="";
  if(T>N)hint=`<p class="hint">会在末尾新增 ${T-N} 个账号（账号${N+1} 起），点“确认”生效。</p>`;
  else if(T<N)hint=`<p class="hint warn">要减少 ${need} 个：请在下面勾选要删除的账号，已选 ${sel.size}/${need}。</p>`;
  const items=state.accounts.map((a,i)=>`<div class="mitem ${sel.has(a.id)?"picked":""}" data-a="${a.id}">
    <label class="pick"><input type="checkbox" data-act="pick" ${sel.has(a.id)?"checked":""} aria-label="选择 ${esc(a.name)}"></label>
    <span class="idx num">${i+1}</span>
    <input class="rn" id="rn-${a.id}" data-act="rename" value="${esc(a.name)}" aria-label="账号名称" enterkeyhint="done"><button class="del" data-act="del" aria-label="删除 ${esc(a.name)}">删除</button></div>`).join("");
  let applyBtn="";
  if(T>N)applyBtn=`<button class="primary" data-act="apply">确认新增 ${T-N} 个</button>`;
  else if(T<N)applyBtn=`<button class="primary" data-act="apply" ${sel.size===need?"":"disabled"}>确认删除 ${need} 个</button>`;
  return `<h2>账号管理</h2>
    <p class="note">名字只给你自己看，建议写成能一眼认出的样子，比如“小号3 尾号28”。在打卡页点账号名字也能直接改。删除账号会一并删掉它的打卡记录。</p>
    <div class="countbox"><b>账号数量</b>
      <div class="stepper"><button class="sq" data-act="tdec" aria-label="减少">−</button>
        <input id="tcnt" class="num" type="text" inputmode="numeric" pattern="[0-9]*" value="${T}" aria-label="目标账号数量">
        <button class="sq" data-act="tinc" aria-label="增加">+</button>
        ${applyBtn}${T!==N?'<button class="ghost" data-act="tcancel">取消</button>':""}</div>${hint}</div>
    <div class="mlist">${items||'<p class="empty">还没有账号。</p>'}</div>
    <div class="actions"><button class="primary" data-act="add">添加一个账号</button>
      ${T===N&&sel.size?`<button class="ghost danger" data-act="delsel">删除选中的 ${sel.size} 个</button>`:""}
      ${N?'<button class="ghost danger" data-act="reset">清空全部重新设置</button>':""}</div>`;
}
function removeAccounts(ids){
  state.accounts=state.accounts.filter(x=>!ids.has(x.id));
  for(const k in state.days)for(const id of ids)delete state.days[k][id];
}

/* ---------- events ---------- */
document.getElementById("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  tab=b.dataset.tab;keepShown.clear();render();window.scrollTo(0,0)});
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]");if(!b||b.disabled)return;
  const act=b.dataset.act,card=b.closest("[data-a]"),aid=card&&card.dataset.a;
  if(act==="tg"){
    e.preventDefault();
    const k=b.dataset.k,key=aid+k,now=Date.now();
    if(lastTap[key]&&now-lastTap[key]<350)return;   // swallow accidental double taps
    lastTap[key]=now;
    const r=rec(day,aid);if(r[k])delete r[k];else r[k]=1;
    save();updateCard(aid);updateStats();
    if(doneCount(day,aid)===6){if(onlyTodo)keepShown.add(aid);toast("这个号今天全部完成")}
    return;
  }
  if(act==="bulk"){const pk=b.dataset.p,tk=b.dataset.t,k=pk+"_"+tk,all=platCount(day,pk,tk)===state.accounts.length;
    for(const a of state.accounts){const r=rec(day,a.id);if(all)delete r[k];else r[k]=1;if(!all&&onlyTodo&&doneCount(day,a.id)===6)keepShown.add(a.id)}
    save();for(const a of state.accounts)updateCard(a.id);updateStats();return}
  if(act==="inc"||act==="dec"){const i=document.getElementById("cnt");i.value=Math.max(1,Math.min(200,(+i.value||0)+(act==="inc"?1:-1)));return}
  if(act==="create"){const n=Math.max(1,Math.min(200,Math.floor(+document.getElementById("cnt").value)||1));
    state.accounts=Array.from({length:n},(_,i)=>({id:uid(),name:"账号"+(i+1)}));save();tab="today";render();return}
  if(act==="prev"){if(day>START)day=shift(day,-1);keepShown.clear();render();return}
  if(act==="next"){if(day<todayKey())day=shift(day,1);keepShown.clear();render();return}
  if(act==="today"){day=todayKey();keepShown.clear();render();return}
  if(act==="tinc"||act==="tdec"){const N=state.accounts.length;target=Math.max(0,Math.min(200,(target??N)+(act==="tinc"?1:-1)));if(target===N)target=null;softRender();return}
  if(act==="tcancel"){target=null;sel.clear();softRender();return}
  if(act==="apply"){const N=state.accounts.length;
    if(target>N){for(let i=N;i<target;i++)state.accounts.push({id:uid(),name:"账号"+(i+1)});toast("已新增 "+(target-N)+" 个账号")}
    else if(target<N&&sel.size===N-target){removeAccounts(sel);toast("已删除 "+sel.size+" 个账号")}
    else return;
    target=null;sel.clear();save();softRender();return}
  if(act==="add"){state.accounts.push({id:uid(),name:"账号"+(state.accounts.length+1)});save();softRender();
    const ins=document.querySelectorAll(".mitem .rn");ins[ins.length-1]?.focus();return}
  if(act==="del"){const a=state.accounts.find(x=>x.id===aid);if(!a||!confirm("删除“"+a.name+"”和它的全部记录？"))return;
    removeAccounts(new Set([aid]));sel.delete(aid);if(target!==null&&target>=state.accounts.length)target=null;save();softRender();return}
  if(act==="delsel"){if(!confirm("删除选中的 "+sel.size+" 个账号和它们的全部记录？"))return;
    removeAccounts(sel);toast("已删除 "+sel.size+" 个账号");sel.clear();save();softRender();return}
  if(act==="reset"){if(!confirm("清空所有账号和打卡记录？这一步不能撤销。"))return;
    state={v:1,ts:state.ts,accounts:[],days:{}};save();tab="today";render();return}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.act==="kwn"){
    const clean=t.value.replace(/\D/g,"");if(clean!==t.value)t.value=clean;
    const aid=t.closest("[data-a]").dataset.a,r=rec(day,aid);
    if(clean==="")delete r.kw_n;else r.kw_n=parseInt(clean,10);
    save();document.getElementById("d-"+aid).innerHTML=deltaHtml(day,aid);return}
  if(t.dataset.act==="rename"){const a=state.accounts.find(x=>x.id===t.closest("[data-a]").dataset.a);if(a){a.name=t.value.trim()||"未命名";save()}return}
  if(t.id==="tcnt"){const c=t.value.replace(/\D/g,"");if(c!==t.value)t.value=c}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="date"&&t.value){day=t.value>todayKey()?todayKey():t.value<START?START:t.value;keepShown.clear();render()}
  if(t.id==="todo"){onlyTodo=t.checked;keepShown.clear();softRender()}
  if(t.id==="tcnt"){const N=state.accounts.length,v=Math.max(0,Math.min(200,parseInt(t.value||"0",10)));target=v===N?null:v;t.blur();softRender()}
  if(t.dataset.act==="pick"){const id=t.closest("[data-a]").dataset.a;if(t.checked)sel.add(id);else sel.delete(id);softRender()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.type!=="checkbox")e.target.blur()});
document.addEventListener("toggle",e=>{if(e.target.id==="bulkbox")bulkOpen=e.target.open},true);
// roll over to the new day if the page stays open past midnight
setInterval(()=>{const k=todayKey();if(day!==k&&day===shift(k,-1)&&!busy()){day=k;keepShown.clear();softRender()}},60000);

if(day<START)day=START;
const local=loadLocal();if(local){state=local;state.ts??=0;const had=Object.keys(state.days).some(k=>k<START);if(had){prune();saveLocal()}}
render();setMode("loading");connect();
</script>
</body>
</html>
