<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>挂播打投打卡</title>
<style>
:root{
  --bg:#EEF0F5; --surface:#FFFFFF; --ink:#1C2030; --ink-2:#5B6175; --line:#DCDFE8;
  --qq:#1FAE68; --kg:#1E86E0; --kw:#D98A00; --veil:rgba(28,32,48,.28);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13151C; --surface:#1D2029; --ink:#ECEEF4; --ink-2:#A3A8B8; --line:#333847;
    --qq:#3DD08A; --kg:#5AAEF5; --kw:#FFC23D; --veil:rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13151C; --surface:#1D2029; --ink:#ECEEF4; --ink-2:#A3A8B8; --line:#333847;
  --qq:#3DD08A; --kg:#5AAEF5; --kw:#FFC23D; --veil:rgba(0,0,0,.45); color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.veil{position:fixed;inset:0;background:var(--veil);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.modal{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 26px 28px;text-align:center;box-shadow:0 18px 50px rgba(20,24,40,.18);animation:pop .35s ease-out both}
.dots{display:inline-flex;gap:6px;margin-bottom:18px}
.dots i{width:10px;height:10px;border-radius:50%;display:block}
.dots i:nth-child(1){background:var(--qq)}.dots i:nth-child(2){background:var(--kg)}.dots i:nth-child(3){background:var(--kw)}
.modal p{margin:0;font-size:17px;line-height:1.85;letter-spacing:.01em}
.face{display:block;margin-top:12px;font-size:20px;color:var(--ink-2)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
</style>
</head>
<body>
<div class="veil">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="msg">
    <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <p id="msg">很开心这个网站可以帮助到娘娘们，它也已经发挥完它的用处了，等到迎接瑞瑞下一个作品时我们再见吧<span class="face">ദ്ദി◝ ⩊ ◜.ᐟ</span></p>
  </div>
</div>
</body>
</html>
